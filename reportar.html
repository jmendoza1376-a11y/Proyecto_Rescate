<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Formulario para registrar un animal rescatado.">
  <title>Reportar un rescate | Control de Rescate y Adopción</title>
</head>
<body>
  <header>
    <h1>Reportar un rescate</h1>
    <nav aria-label="Navegación principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="reportar.html" aria-current="page">Reportar un rescate</a></li>
        <li><a href="rescates.html">Reporte de rescates</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section aria-labelledby="datos-rescate">
      <h2 id="datos-rescate">Datos del rescate</h2>
      <form action="reportar.html" method="get">
        <fieldset>
          <legend>Información del animal</legend>

          <p>
            <label for="nombre-animal">Nombre o identificación provisional</label>
            <input id="nombre-animal" name="nombre" type="text" autocomplete="off" required maxlength="80">
          </p>

          <p>
            <label for="especie">Especie</label>
            <select id="especie" name="especie" required>
              <option value="" selected disabled>Seleccione una especie</option>
              <option value="perro">Perro</option>
              <option value="gato">Gato</option>
              <option value="otro">Otro</option>
            </select>
          </p>

          <p>
            <label for="descripcion-especie">Especifique otra especie (si corresponde)</label>
            <input id="descripcion-especie" name="otra-especie" type="text" maxlength="60">
          </p>

          <p>
            <label for="fecha-rescate">Fecha del rescate</label>
            <input id="fecha-rescate" name="fecha" type="date" required>
          </p>

          <p>
            <label for="estado">Estado actual</label>
            <select id="estado" name="estado" required>
              <option value="" selected disabled>Seleccione un estado</option>
              <option value="atencion">En atención veterinaria</option>
              <option value="refugio">En refugio</option>
              <option value="adopcion">En proceso de adopción</option>
              <option value="adoptado">Adoptado</option>
            </select>
          </p>
        </fieldset>

        <fieldset>
          <legend>Datos del reporte</legend>

          <p>
            <label for="ubicacion">Lugar del rescate</label>
            <input id="ubicacion" name="ubicacion" type="text" required maxlength="160">
          </p>

          <p>
            <label for="detalles">Descripción y observaciones</label>
            <textarea id="detalles" name="detalles" rows="5" required maxlength="1000"></textarea>
          </p>

          <p>
            <label for="correo">Correo electrónico de contacto</label>
            <input id="correo" name="correo" type="email" autocomplete="email" required maxlength="254">
          </p>

          <p>
            <label for="telefono">Teléfono de contacto (opcional)</label>
            <input id="telefono" name="telefono" type="tel" autocomplete="tel" pattern="[0-9+() -]{7,20}" title="Use entre 7 y 20 caracteres: números, espacios o los símbolos + ( ) -.">
          </p>
        </fieldset>

        <p>
          <input id="autorizacion" name="autorizacion" type="checkbox" value="si" required>
          <label for="autorizacion">Confirmo que la información proporcionada es correcta.</label>
        </p>

        <button type="submit">Enviar reporte</button>
        <button type="reset">Limpiar formulario</button>
      </form>
    </section>
  </main>

  <footer>
    <p><a href="index.html">Volver al inicio</a></p>
  </footer>
</body>
</html>
